<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1F6F5C">
</head>
<body>
<title>そなえ｜備品の発注・在庫アシスタント</title>
<style>
  :root{
    --bg:#F3EFE8; --surface:#FFFFFF; --surface-2:#FAF7F1; --surface-3:#F1ECE2;
    --border:#E5DFD3; --border-strong:#D6CDBC;
    --ink:#221E17; --muted:#6D675B; --faint:#9A9383;
    --accent:#1F6F5C; --accent-ink:#134B3E; --accent-fg:#FFFFFF; --accent-soft:#E3F0EB;
    --warn:#9C6B12; --warn-soft:#F6EAD3;
    --danger:#AF382B; --danger-soft:#F6E1DD;
    --radius:14px; --radius-sm:9px;
    --shadow-sm:0 1px 2px rgba(34,30,23,.06);
    --shadow:0 1px 2px rgba(34,30,23,.05), 0 10px 30px rgba(34,30,23,.07);
    --ff: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14120E; --surface:#1E1A14; --surface-2:#252019; --surface-3:#2C261E;
      --border:#332D24; --border-strong:#453E32;
      --ink:#EDE7DB; --muted:#A79F90; --faint:#7B7363;
      --accent:#4FB89C; --accent-ink:#8FD9C5; --accent-fg:#0C1B17; --accent-soft:#18332C;
      --warn:#D99B3E; --warn-soft:#352A16;
      --danger:#D96B5C; --danger-soft:#371F1B;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#F3EFE8; --surface:#FFFFFF; --surface-2:#FAF7F1; --surface-3:#F1ECE2;
    --border:#E5DFD3; --border-strong:#D6CDBC;
    --ink:#221E17; --muted:#6D675B; --faint:#9A9383;
    --accent:#1F6F5C; --accent-ink:#134B3E; --accent-fg:#FFFFFF; --accent-soft:#E3F0EB;
    --warn:#9C6B12; --warn-soft:#F6EAD3; --danger:#AF382B; --danger-soft:#F6E1DD;
    --shadow-sm:0 1px 2px rgba(34,30,23,.06);
    --shadow:0 1px 2px rgba(34,30,23,.05), 0 10px 30px rgba(34,30,23,.07);
  }
  :root[data-theme="dark"]{
    --bg:#14120E; --surface:#1E1A14; --surface-2:#252019; --surface-3:#2C261E;
    --border:#332D24; --border-strong:#453E32;
    --ink:#EDE7DB; --muted:#A79F90; --faint:#7B7363;
    --accent:#4FB89C; --accent-ink:#8FD9C5; --accent-fg:#0C1B17; --accent-soft:#18332C;
    --warn:#D99B3E; --warn-soft:#352A16; --danger:#D96B5C; --danger-soft:#371F1B;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--ff); color:var(--ink); background:var(--bg);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    font-feature-settings:"palt" 1;
  }
  button{font-family:inherit}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- Shell ---------- */
  .app{display:grid; grid-template-columns:268px 1fr; min-height:100vh}
  .sidebar{
    background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:6px; padding:20px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:11px; padding:4px 6px 14px}
  .brand .mark{
    width:38px; height:38px; border-radius:11px; flex:none;
    background:linear-gradient(150deg,var(--accent),var(--accent-ink));
    display:grid; place-items:center; color:var(--accent-fg); box-shadow:var(--shadow-sm);
  }
  .brand .mark svg{width:21px;height:21px}
  .brand .name{font-size:18px; font-weight:800; letter-spacing:.02em; line-height:1}
  .brand .sub{font-size:11px; color:var(--faint); letter-spacing:.12em; margin-top:4px; text-transform:uppercase}

  .label{font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--faint); text-transform:uppercase; padding:14px 8px 6px}

  .store-select{position:relative}
  .store-select select{
    appearance:none; width:100%; padding:11px 34px 11px 12px; font-size:14.5px; font-weight:600;
    color:var(--ink); background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:var(--radius-sm); cursor:pointer; font-family:inherit;
  }
  .store-select::after{content:"▾"; position:absolute; right:13px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none}
  .store-meta{display:flex; gap:6px; padding:9px 6px 2px; flex-wrap:wrap}

  .nav{display:flex; flex-direction:column; gap:3px; margin-top:6px}
  .nav button{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    padding:10px 12px; border:1px solid transparent; border-radius:var(--radius-sm);
    background:transparent; color:var(--muted); font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .nav button svg{width:18px;height:18px;flex:none;opacity:.8}
  .nav button:hover{background:var(--surface-2); color:var(--ink)}
  .nav button.active{background:var(--accent-soft); color:var(--accent-ink); border-color:color-mix(in srgb,var(--accent) 22%, transparent)}
  .nav button .count{margin-left:auto; font-size:11.5px; font-weight:700; background:var(--accent); color:var(--accent-fg); border-radius:20px; min-width:20px; text-align:center; padding:1px 6px}
  .sidebar .foot{margin-top:auto; padding-top:14px; display:flex; flex-direction:column; gap:8px}
  .theme-toggle{display:flex; align-items:center; gap:8px; justify-content:center; padding:9px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--muted); cursor:pointer; font-size:13px; font-weight:600}
  .theme-toggle:hover{color:var(--ink)}
  .foot .note{font-size:11px; color:var(--faint); text-align:center; line-height:1.5}

  /* ---------- Main ---------- */
  .main{min-width:0; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:18px 28px;
    border-bottom:1px solid var(--border); background:color-mix(in srgb,var(--bg) 70%, transparent);
    position:sticky; top:0; z-index:20; backdrop-filter:saturate(1.2) blur(8px);
  }
  .topbar h1{font-size:19px; font-weight:800; margin:0; letter-spacing:.01em}
  .topbar .where{font-size:12.5px; color:var(--muted); margin-top:2px}
  .topbar .spacer{flex:1}
  .menu-btn{display:none}
  .view{padding:26px 28px 60px; max-width:1120px; width:100%}

  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:30px; letter-spacing:.02em}
  .chip.sauna{background:var(--warn-soft); color:var(--warn)}
  .chip.hotel{background:var(--accent-soft); color:var(--accent-ink)}
  .chip.area{background:var(--surface-3); color:var(--muted)}
  .sup{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; white-space:nowrap}
  .sup-amz{background:#FCE9D6; color:#8A4B12}
  .sup-rakuten{background:#F7D9D9; color:#A32020}
  .sup-takagi{background:#DCE7F5; color:#274C82}
  .sup-bulk{background:#E2E0DB; color:#3B372F}
  .sup-other{background:var(--surface-3); color:var(--muted)}
  :root[data-theme="dark"] .sup-amz{background:#3A2A18; color:#E7B583}
  :root[data-theme="dark"] .sup-rakuten{background:#3A1E1E; color:#E79A9A}
  :root[data-theme="dark"] .sup-takagi{background:#1E2A3E; color:#9FBEE8}
  :root[data-theme="dark"] .sup-bulk{background:#2C2A24; color:#C7C1B4}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .sup-amz{background:#3A2A18; color:#E7B583}
    :root:not([data-theme="light"]) .sup-rakuten{background:#3A1E1E; color:#E79A9A}
    :root:not([data-theme="light"]) .sup-takagi{background:#1E2A3E; color:#9FBEE8}
    :root:not([data-theme="light"]) .sup-bulk{background:#2C2A24; color:#C7C1B4}
  }

  /* ---------- Chat ---------- */
  .chat-layout{display:grid; grid-template-columns:1fr 340px; gap:22px; align-items:start}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm)}
  .card.pad{padding:18px}
  .card-head{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border)}
  .card-head h2{font-size:15px; font-weight:800; margin:0}
  .card-head .hint{font-size:12px; color:var(--faint); margin-left:auto}

  .chat-window{display:flex; flex-direction:column; height:min(64vh,560px)}
  .chat-scroll{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px}
  .msg{display:flex; gap:10px; max-width:84%}
  .msg .av{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800}
  .msg.bot .av{background:var(--accent-soft); color:var(--accent-ink)}
  .msg .bubble{padding:10px 13px; border-radius:13px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word}
  .msg.bot .bubble{background:var(--surface-2); border:1px solid var(--border); border-top-left-radius:4px}
  .msg.user{align-self:flex-end; flex-direction:row-reverse}
  .msg.user .bubble{background:var(--accent); color:var(--accent-fg); border-top-right-radius:4px}
  .msg.user .av{background:var(--surface-3); color:var(--muted)}
  .msg .bubble b{font-weight:800}
  .chat-input{display:flex; gap:8px; padding:13px; border-top:1px solid var(--border); background:var(--surface-2)}
  .chat-input input{flex:1; padding:11px 14px; border:1px solid var(--border-strong); border-radius:24px; font-size:14.5px; background:var(--surface); color:var(--ink); font-family:inherit}
  .chat-input input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  .quick{display:flex; gap:7px; flex-wrap:wrap; padding:0 13px 13px; background:var(--surface-2)}
  .quick button{font-size:12.5px; font-weight:600; padding:6px 11px; border:1px solid var(--border-strong); border-radius:30px; background:var(--surface); color:var(--muted); cursor:pointer}
  .quick button:hover{color:var(--accent-ink); border-color:var(--accent)}

  .btn{border:none; border-radius:var(--radius-sm); padding:10px 15px; font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; justify-content:center}
  .btn.primary{background:var(--accent); color:var(--accent-fg)}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--border-strong)}
  .btn.ghost:hover{border-color:var(--muted)}
  .btn.send{border-radius:24px; padding:11px 16px}
  .btn.sm{padding:6px 11px; font-size:12.5px; border-radius:8px}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid transparent}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn[disabled]{opacity:.45; cursor:not-allowed}

  /* cart */
  .cart-items{display:flex; flex-direction:column; gap:2px; padding:6px}
  .cart-row{display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:10px; border-radius:9px}
  .cart-row:hover{background:var(--surface-2)}
  .cart-row .nm{font-size:13.5px; font-weight:700}
  .cart-row .sp{font-size:11.5px; color:var(--faint)}
  .cart-row .sub{font-size:13.5px; font-weight:700; text-align:right}
  .stepper{display:inline-flex; align-items:center; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; margin-top:4px}
  .stepper button{width:26px; height:26px; border:none; background:var(--surface-2); color:var(--ink); cursor:pointer; font-size:15px; font-weight:700; line-height:1}
  .stepper button:hover{background:var(--surface-3)}
  .stepper span{min-width:30px; text-align:center; font-size:13px; font-weight:700}
  .cart-foot{padding:14px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:11px}
  .total-row{display:flex; justify-content:space-between; align-items:baseline}
  .total-row .t{font-size:12.5px; color:var(--muted); font-weight:600}
  .total-row .v{font-size:22px; font-weight:800; letter-spacing:-.01em}
  .empty{padding:34px 18px; text-align:center; color:var(--faint); font-size:13.5px}
  .empty svg{width:30px;height:30px;opacity:.5;margin-bottom:8px}

  /* ---------- Tables / master ---------- */
  .toolbar{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
  .search{position:relative; flex:1; min-width:200px}
  .search input{width:100%; padding:10px 12px 10px 34px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit}
  .search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px;height:15px; color:var(--faint)}
  .mini-select{appearance:none; padding:9px 12px; border:1px solid var(--border-strong); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--ink); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface)}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px}
  thead th{text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:700; padding:12px 14px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface-2)}
  tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .p-name{font-weight:700}
  .p-alias{font-size:11.5px; color:var(--faint)}
  .row-actions{display:flex; gap:4px; justify-content:flex-end}
  .icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}
  .icon-btn:hover{background:var(--surface-3); color:var(--ink)}
  .icon-btn.del:hover{background:var(--danger-soft); color:var(--danger)}
  .icon-btn svg{width:15px;height:15px}
  a.amz{color:var(--accent-ink); text-decoration:none; font-weight:600; font-size:12.5px}
  a.amz:hover{text-decoration:underline}
  .cart-ok{font-size:10.5px; color:var(--accent-ink); font-weight:700; margin-top:3px}
  .cart-no{font-size:10.5px; color:var(--faint); font-weight:600; margin-top:3px}

  /* history */
  .hist-list{display:flex; flex-direction:column; gap:14px}
  .hist-card{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden}
  .hist-head{display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); flex-wrap:wrap}
  .hist-head .no{font-weight:800; font-size:14px}
  .hist-head .dt{font-size:12.5px; color:var(--muted)}
  .hist-head .tot{margin-left:auto; font-weight:800; font-size:15px}
  .hist-body{padding:6px 16px 12px}
  .hist-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13.5px}
  .hist-line:last-child{border-bottom:none}
  .hist-line .q{color:var(--muted); font-variant-numeric:tabular-nums}

  /* ---------- Stock check ---------- */
  .stock-wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
  .stock-progress{display:flex; flex-direction:column; gap:9px}
  .stock-progress .bar{height:8px; border-radius:20px; background:var(--surface-3); overflow:hidden}
  .stock-progress .bar span{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-ink)); border-radius:20px; transition:width .3s}
  .stock-progress .meta{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); font-weight:600}
  .stock-progress .meta b{color:var(--ink); font-variant-numeric:tabular-nums}
  .stock-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:26px 24px; text-align:center}
  .stock-card .tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-soft); padding:4px 11px; border-radius:20px}
  .stock-card .s-name{font-size:26px; font-weight:800; margin:14px 0 4px; letter-spacing:-.01em; text-wrap:balance}
  .stock-card .s-alias{font-size:13px; color:var(--faint)}
  .stock-facts{display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:16px 0 6px}
  .fact{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 13px; font-size:13px; display:flex; flex-direction:column; gap:2px; min-width:96px}
  .fact .fk{font-size:10.5px; color:var(--faint); font-weight:700; letter-spacing:.06em}
  .fact .fv{font-weight:700; font-variant-numeric:tabular-nums}
  .stock-card .s-q{margin:18px 0 16px; font-size:15px; font-weight:700; color:var(--muted)}
  .s-actions{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .big-btn{padding:16px; border-radius:13px; font-size:16px; font-weight:800; cursor:pointer; border:1.5px solid transparent; display:flex; align-items:center; justify-content:center; gap:8px}
  .big-btn svg{width:20px;height:20px}
  .big-btn.ok{background:var(--accent); color:var(--accent-fg)}
  .big-btn.ok:hover{background:var(--accent-ink)}
  .big-btn.order{background:var(--surface-2); color:var(--warn); border-color:var(--warn)}
  .big-btn.order:hover{background:var(--warn-soft)}
  .order-panel{margin-top:18px; border-top:1px dashed var(--border); padding-top:18px; display:flex; flex-direction:column; gap:14px; align-items:center}
  .order-panel .lead{font-size:14px; font-weight:700}
  .qty-big{display:inline-flex; align-items:center; gap:0; border:1.5px solid var(--border-strong); border-radius:12px; overflow:hidden}
  .qty-big button{width:48px; height:48px; border:none; background:var(--surface-2); color:var(--ink); font-size:22px; font-weight:800; cursor:pointer; line-height:1}
  .qty-big button:hover{background:var(--surface-3)}
  .qty-big input{width:70px; height:48px; border:none; border-left:1px solid var(--border); border-right:1px solid var(--border); text-align:center; font-size:20px; font-weight:800; background:var(--surface); color:var(--ink); font-variant-numeric:tabular-nums; -moz-appearance:textfield}
  .qty-big input::-webkit-outer-spin-button,.qty-big input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .qty-big input:focus{outline:2px solid var(--accent); outline-offset:-2px}
  .order-panel .subt{font-size:13px; color:var(--muted); font-weight:600}
  .order-panel .subt b{color:var(--ink); font-size:15px}
  .order-panel .buttons{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; width:100%}
  .order-panel .buttons .btn{flex:1; min-width:150px}
  .amz-note{font-size:11.5px; color:var(--faint)}
  .stock-nav{display:flex; justify-content:space-between; align-items:center}
  .link-btn{background:none; border:none; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; padding:6px 8px; border-radius:8px; display:inline-flex; align-items:center; gap:5px}
  .link-btn:hover{color:var(--ink); background:var(--surface-2)}
  .link-btn[disabled]{opacity:.35; cursor:default}
  .stock-done{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-sm); padding:30px 24px; text-align:center}
  .stock-done .big-check{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 12px}
  .stock-done .big-check svg{width:30px;height:30px}
  .stock-done h2{font-size:20px; font-weight:800; margin:0 0 6px}
  .stock-done p{color:var(--muted); margin:0 0 18px; font-size:14px}
  .done-list{text-align:left; border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:18px}
  .done-list .dl-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); font-size:14px}
  .done-list .dl-row:last-child{border-bottom:none}
  .done-list .dl-row .q{color:var(--muted); font-variant-numeric:tabular-nums; font-weight:700}
  .done-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}

  /* ---------- Stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 17px; box-shadow:var(--shadow-sm)}

    { name:"貝印カミソリ", supplier:T, spec:"ステラ 白スムーザー付 既製袋入" },
    { name:"くし", supplier:T, spec:"(YL) ポケットクシM 袋入り" },
    { name:"ボディスポンジ", supplier:T, spec:"SAボディスポンジ BBS" },
    { name:"歯ブラシ＆歯磨き粉", supplier:T, spec:"[CH]SAアークBKハブラシ24穴先細(黒)＋3gラミチューブ" },
    { name:"手指消毒 詰替 4L（アルコール）", supplier:T, spec:"花王 ハンドスキッシュEX 4.5L" },
    { name:"綿棒（200本入り）", supplier:T, spec:"綿棒(200入) CTM-03" },
    { name:"フェイスソープ（ルシード）2L", supplier:T, spec:"ルシード フェイスソープ 2L" },
    { name:"バイゲンラックス 6% 18L", supplier:T, spec:"バイゲンラックス 6% 18L" },
    { name:"フローリングワイパー", supplier:T, spec:"フきとれ〜る フローリング用ウェットシート 20枚入（欠品しやすい）" },
    { name:"泡ハンドソープ 4L", supplier:T, spec:"ビオレU 泡で出てくるハンドソープ プレーン 4L" },
    { name:"ハーフティッシュ", supplier:T, spec:"M詰替 ハーフティッシュ 50W" },
    { name:"ペーパータオル", supplier:T, spec:"タイムリー ペーパータオルM 200枚(30入)（長期欠品）" },
    { name:"ハンドタオル", supplier:T, spec:"クレシア ハンドタオル バリューソフト200" },
  ].map(p => ({ alias:"", unit:"", price:0, url:"", asin:"", ...p }));

  /* ========= サーバー自動発注（フェーズ2で使用） =========
     自社サーバーの発注受け口URLを入れると、発注確定時にそのサーバーへ注文データを送ります。
     空のままなら送信しません（アプリ単体で動作）。例: "https://自分のサーバー/order" */
  const ORDER_ENDPOINT = "";

  /* ========= State & persistence ========= */
  const STORAGE_KEY = "sonae_v5";
  let _uidc = 0;
  const uid = () => (Date.now().toString(36) + (_uidc++).toString(36) + Math.floor(Math.random()*1e6).toString(36));
  let state;

  function freshState(){
    // 各サウナ店に初期商品を配布（店舗ごとに独立して編集できる）。ホテルは空でスタート。
    const products = STORES
      .filter(s => s.type === "サウナ")
      .flatMap(s => SEED_PRODUCTS.map(p => ({ id: uid(), storeId: s.id, ...p })));
    return {
      currentStore: STORES[0].id,
      theme: null,
      products,      // [{id, storeId, ...}]
      cart: {},      // storeId -> [{productId, qty}]
      history: {},   // storeId -> [{id, date, items:[...], total}]
      chat: {},      // storeId -> [{role, text}]
    };
  }
  // 既存データを消さずに、seedのASIN等を名前一致で補完する
  function migrate(s){
    const asinByName = {};
    SEED_PRODUCTS.forEach(p => { if(p.asin) asinByName[p.name] = p.asin; });
    (s.products || []).forEach(p => {
      if((!p.asin || !String(p.asin).trim()) && asinByName[p.name]) p.asin = asinByName[p.name];
    });
    return s;
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ const s = JSON.parse(raw); if(s && s.products) return migrate(s); }
    }catch(e){}
    return freshState();
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  state = load();

  const store = () => STORES.find(s => s.id === state.currentStore) || STORES[0];
  const cart = () => (state.cart[state.currentStore] ||= []);
  const history = () => (state.history[state.currentStore] ||= []);
  const chatLog = () => (state.chat[state.currentStore] ||= []);
  const product = (id) => state.products.find(p => p.id === id);
  // 現在の店舗に登録された商品だけを返す（店舗ごとに独立）
  const scopedProducts = () => state.products.filter(p => p.storeId === state.currentStore);
  const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
  const priceLabel = (p) => (p && p.price>0) ? yen(p.price) : "—";
  const totalLabel = (n) => n>0 ? yen(n) : "価格未設定";

  // 購入先ごとの注文情報：url（開くURL）/ label（ボタン文言）/ note（補足）
  function orderInfo(p){
    const s = p.supplier || "Amazon";
    if(p.url && /^https?:/.test(p.url.trim())){
      const lab = s==="Amazon" ? "Amazonで注文" : (s+"で注文");
      return { url:p.url.trim(), label:lab, note:"登録済みの商品ページを開きます。" };
    }
    if(s==="Amazon")
      return { url:"https://www.amazon.co.jp/s?k="+encodeURIComponent(p.name), label:"Amazonで検索", note:"URL未登録のためAmazonで商品名を検索します。" };
    if(s==="楽天市場")
      return { url:"https://search.rakuten.co.jp/search/mall/"+encodeURIComponent(p.name)+"/", label:"楽天で検索", note:"URL未登録のため楽天市場で検索します。" };
    if(s==="バルクオム")
      return { url:"https://bulk.co.jp/", label:"購入サイトを開く", note:"バルクオムの購入サイトを開きます。" };
    if(s==="髙木商会")
      return { url:null, label:"発注リストに追加", note:"髙木商会へチャットで発注する品目です（Web注文なし）。" };
    return { url:null, label:"発注リストに追加", note:"" };
  }
  function supplierChipClass(s){
    return s==="Amazon"?"sup-amz":s==="楽天市場"?"sup-rakuten":s==="髙木商会"?"sup-takagi":s==="バルクオム"?"sup-bulk":"sup-other";
  }

  // URL から ASIN（10桁英数）を抽出。手入力のasinを優先。
  function extractAsin(url){
    const m = String(url||"").match(/(?:\/dp\/|\/gp\/product\/|\/gp\/aws\/cart\/add[^]*asin=|[?&]asin=)([A-Z0-9]{10})/i);
    return m ? m[1].toUpperCase() : "";
  }
  const getAsin = (p) => (p.asin && p.asin.trim()) ? p.asin.trim().toUpperCase() : extractAsin(p.url);
  // Amazonで数量つきにカート投入できる品か
  const canAmazonCart = (p) => (p.supplier||"Amazon")==="Amazon" && !!getAsin(p);

  // 複数商品を一括でAmazonカートに入れるURL（数量つき）
  function amazonCartUrl(list){
    const params = list.map((it,i)=>`ASIN.${i+1}=${encodeURIComponent(it.asin)}&Quantity.${i+1}=${it.qty}`).join("&");
    return "https://www.amazon.co.jp/gp/aws/cart/add.html?" + params;
  }
  // 発注カートのAmazon品（ASINあり）をまとめてAmazonカートへ
  function openAmazonCart(){
    const amzn = [], skipped = [];
    for(const i of cart()){
      const p = product(i.productId); if(!p) continue;
      if(canAmazonCart(p)) amzn.push({ asin:getAsin(p), qty:i.qty, name:p.name });
      else skipped.push(p.name);
    }
    if(amzn.length===0){
      toast("ASIN登録済みのAmazon商品がカートにありません");
      return { ok:false, skipped };
    }
    window.open(amazonCartUrl(amzn), "_blank", "noopener");
    toast(`${amzn.length} 品目をAmazonカートへ送りました`);
    return { ok:true, added:amzn.length, skipped };
  }

  // サーバー自動発注（設定時のみ・失敗は無視＝履歴には残る）
  function sendToBackend(entry){
    if(!ORDER_ENDPOINT) return;
    try{
      fetch(ORDER_ENDPOINT, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ store: store().id, storeName: store().name, order: entry })
      }).catch(()=>{});
    }catch(e){}
  }

  /* ========= Helpers ========= */
  const $ = (sel, el=document) => el.querySelector(sel);
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let toastTimer;
  function toast(msg){
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  /* ========= Cart ops ========= */
  function cartQty(pid){ const r = cart().find(i=>i.productId===pid); return r ? r.qty : 0; }
  function addToCart(pid, qty){
    qty = Math.max(1, qty|0 || 1);
    const r = cart().find(i=>i.productId===pid);
    if(r) r.qty += qty; else cart().push({productId:pid, qty});
    save();
  }
  function setQty(pid, qty){
    const list = cart(); const idx = list.findIndex(i=>i.productId===pid);
    if(idx<0) return;
    if(qty<=0) list.splice(idx,1); else list[idx].qty = qty;
    save();
  }
  function cartTotal(){ return cart().reduce((s,i)=>{ const p=product(i.productId); return s + (p?p.price*i.qty:0); },0); }
  function cartCount(){ return cart().reduce((s,i)=>s+i.qty,0); }

  /* ========= Chat engine ========= */
  function pushChat(role, text){ chatLog().push({role, text}); save(); }

  function matchProduct(text){
    if(!text) return null;
    const q = text.replace(/\s+/g,"").toLowerCase();
    if(!q) return null;
    const norm = (s)=>String(s||"").replace(/\s+/g,"").toLowerCase();
    // exact-ish on name or alias
    let best=null, bestScore=0;
    for(const p of scopedProducts()){
      const n = norm(p.name), a = norm(p.alias);
      let sc=0;
      if(n===q || a===q) sc=100;
      else if(a && (q.includes(a)||a.includes(q))) sc=Math.max(sc, 70 + Math.min(a.length,q.length));
      else if(n.includes(q)||q.includes(n)) sc=Math.max(sc, 60 + Math.min(n.length,q.length));
      if(sc>bestScore){ bestScore=sc; best=p; }
    }
    return bestScore>0 ? best : null;
  }

  // convert full-width digits then parse
  function parseQty(raw){
    const z2h = raw.replace(/[０-９]/g, d => "0123456789"["０１２３４５６７８９".indexOf(d)]);
    const m = z2h.match(/(\d+)/);
    return m ? parseInt(m[1],10) : null;
  }

  function handleCommand(raw){
    const text = raw.trim();
    if(!text) return null;

    if(/^(発注|注文|確定|これで|オーダー)/.test(text) && !/(取消|キャンセル|やめ)/.test(text)){
      return finalizeOrder();
    }
    if(/(クリア|取消|キャンセル|空に|やめ|リセット)/.test(text)){
      if(cart().length===0) return "カートは空です。";
      state.cart[state.currentStore] = []; save(); renderCart(); updateCartBadge();
      return "カートを空にしました。";
    }
    if(/(カート|合計|いくら|確認|今の)/.test(text)){
      return cartSummaryText();
    }
    if(/(一覧|商品|メニュー|何が|なにが|リスト|品目)/.test(text)){
      return listProductsText();
    }
    if(/(ヘルプ|help|使い方|つかいかた)/i.test(text)){
      return helpText();
    }

    // product + qty
    const qty = parseQty(text) || 1;
    const nameText = text
      .replace(/[0-9０-９]+\s*(個|本|箱|ケース|ケ|枚|セット|膳|着|つ|点)?/g,"")
      .replace(/(を|追加|発注|注文|ください|お願いします?|ちょうだい|ほしい|欲しい|頼む|たのむ)/g,"")
      .trim();
    const p = matchProduct(nameText) || matchProduct(text);
    if(p){
      addToCart(p.id, qty);
      renderCart(); updateCartBadge();
      return `「${p.name}」を ${qty} ${unitShort(p.unit)} カートに追加しました。\n現在 ${cartCount()} 点 / ${yen(cartTotal())} です。「発注」で確定できます。`;
    }
    return `「${text}」に一致する商品が見つかりませんでした。\n「一覧」で登録商品を確認するか、「商品マスタ」から登録してください。`;
  }

  function unitShort(unit){
    if(!unit) return "点";
    const m = String(unit).match(/(ケース|箱|本|枚|袋|セット|缶|個)/);
    return m ? m[1] : "点";
  }

  function cartSummaryText(){
    if(cart().length===0) return "カートは空です。商品名と数量を送ってください（例：カビキラー 2）。";
    let s = "🧺 現在のカート\n";
    for(const i of cart()){ const p=product(i.productId); if(!p) continue;
      s += `・${p.name} × ${i.qty}${p.price>0?" ＝ "+yen(p.price*i.qty):""}\n`; }
    s += `―――\n合計 ${cartCount()} 点 ／ ${totalLabel(cartTotal())}\n「発注」で確定します。`;
    return s;
  }
  function listProductsText(){
    const sp = scopedProducts();
    let s = "📋 登録商品（" + sp.length + "件・" + store().type + "）\n";
    sp.slice(0,20).forEach(p=>{ s += `・${p.name}（${p.supplier||"-"}）${p.price>0?" "+yen(p.price):""}\n`; });
    if(sp.length>20) s += `…ほか ${sp.length-20} 件（「商品マスタ」で全件表示）\n`;
    s += "\n「商品名＋数量」で追加できます（例：カビキラー 2）。";
    return s;
  }
  function helpText(){
    return "こう使えます：\n① 「タオル 3」のように 商品名＋数量 を送る\n② 「カート」で中身と合計を確認\n③ 「発注」で確定 → 発注履歴に保存\n他：「一覧」＝商品一覧 / 「クリア」＝カートを空に";
  }

  function finalizeOrder(){
    if(cart().length===0) return "カートが空です。先に商品を追加してください（例：トイペ 2）。";
    const items = cart().map(i=>{ const p=product(i.productId);
      return { name:p.name, supplier:p.supplier, spec:p.spec, unit:p.unit, qty:i.qty, price:p.price }; });
    const total = cartTotal();
    const entry = { id: uid(), date: new Date().toISOString(), items, total };
    history().unshift(entry);
    state.cart[state.currentStore] = [];
    save(); renderCart(); updateCartBadge();
    sendToBackend(entry);
    return `✅ ${store().name} の発注を確定しました。\n${items.length} 品目 ／ 合計 ${totalLabel(total)}\n「発注履歴」から確認・CSV出力できます。`;
  }

  function botReply(raw){
    pushChat("user", raw);
    renderChatMessages();
    const reply = handleCommand(raw) || "うまく聞き取れませんでした。「ヘルプ」と送ってみてください。";
    pushChat("bot", reply);
    renderChatMessages();
  }

  function ensureGreeting(){
    if(chatLog().length===0){
      pushChat("bot", `${store().name} の発注チャットです。\n備品名と数量を送ってください（例：「カビキラー 2」「トイレマジックリン 3」）。\n「在庫確認」で1品ずつチェック、「一覧」で商品、「カート」で今の注文、「発注」で確定します。`);
    }
  }

  /* ========= Rendering ========= */
  const view = $("#view");
  let activeView = "chat";
  let masterSearch = "";

  function renderStoreSelect(){
    const sel = $("#storeSelect");
    sel.innerHTML = STORES.map(s=>`<option value="${s.id}" ${s.id===state.currentStore?"selected":""}>${esc(s.name)}</option>`).join("");
    const s = store();
    $("#storeMeta").innerHTML =
      `<span class="chip ${s.type==='ホテル'?'hotel':'sauna'}">${esc(s.type)}</span>`+
      `<span class="chip area">${esc(s.area)}</span>`;
  }

  function updateCartBadge(){
    const c = cartCount(), el = $("#cartCount");
    el.textContent = c;
    el.classList.toggle("hide", c===0);
  }

  function setView(name){
    activeView = name;
    $$(".nav button").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
    const titles = { chat:"発注チャット", stock:"在庫確認", master:"商品マスタ", history:"発注履歴" };
    $("#viewTitle").textContent = titles[name];
    $("#viewWhere").textContent = store().name + " ・ " + store().area;
    $("#addProductTop").classList.toggle("hide", name!=="master");
    closeSidebar();
    if(name==="chat") renderChat();
    else if(name==="stock") enterStock();
    else if(name==="master") renderMaster();
    else renderHistory();
  }
  function $$(s,el=document){ return Array.from(el.querySelectorAll(s)); }

  /* ----- Chat view ----- */
  function renderChat(){
    view.innerHTML = `
      <div class="chat-layout">
        <div class="card chat-window">
          <div class="card-head">
            <h2>発注チャット</h2>
            <span class="hint">${esc(store().name)} 宛</span>
          </div>
          <div class="chat-scroll" id="chatScroll"></div>
          <div class="quick" id="quick"></div>
          <form class="chat-input" id="chatForm">
            <input id="chatInput" autocomplete="off" placeholder="例：カビキラー 2 / トイレマジックリン 3 / 発注" />
            <button class="btn primary send" type="submit">送信</button>
          </form>
        </div>
        <div>
          <div class="card" id="cartCard"></div>
        </div>
      </div>`;
    ensureGreeting();
    renderChatMessages();
    renderQuick();
    renderCart();
    $("#chatForm").addEventListener("submit", e=>{
      e.preventDefault();
      const inp = $("#chatInput"); const v = inp.value.trim();
      if(!v) return; inp.value=""; botReply(v);
    });
  }
  function renderQuick(){
    const chips = ["一覧","カート","発注","ヘルプ"];
    $("#quick").innerHTML = chips.map(c=>`<button type="button" data-q="${c}">${c}</button>`).join("");
    $$("#quick button").forEach(b=> b.addEventListener("click", ()=>botReply(b.dataset.q)));
  }
  function renderChatMessages(){
    const sc = $("#chatScroll"); if(!sc) return;
    sc.innerHTML = chatLog().map(m=>{
      const av = m.role==="bot" ? "そ" : "店";
      return `<div class="msg ${m.role}"><div class="av">${av}</div><div class="bubble">${formatMsg(m.text)}</div></div>`;
    }).join("");
    sc.scrollTop = sc.scrollHeight;
  }
  function formatMsg(t){
    return esc(t).replace(/「([^」]+)」/g, "「<b>$1</b>」").replace(/\n/g,"<br>");
  }
  function renderCart(){
    const el = $("#cartCard"); if(!el) return;
    const items = cart();
    const amznCount = items.filter(i=>{ const p=product(i.productId); return p && canAmazonCart(p); }).length;
    let body;
    if(items.length===0){
      body = `<div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <div>カートは空です</div>
        <div style="font-size:12px;margin-top:4px">チャットで「商品名＋数量」を送ると<br>ここに追加されます。</div>
      </div>`;
    } else {
      body = `<div class="cart-items">` + items.map(i=>{
        const p = product(i.productId); if(!p) return "";
        return `<div class="cart-row">
          <div>
            <div class="nm">${esc(p.name)}</div>
            <div class="sp">${esc(p.supplier||"")}${p.unit?" ・ "+esc(p.unit):""} ・ ${priceLabel(p)}</div>
            <div class="stepper" data-id="${p.id}">
              <button data-act="dec" aria-label="減らす">−</button>
              <span class="tnum">${i.qty}</span>
              <button data-act="inc" aria-label="増やす">＋</button>
            </div>
          </div>
          <div class="sub tnum">${p.price>0?yen(p.price*i.qty):"—"}</div>
        </div>`;
      }).join("") + `</div>
      <div class="cart-foot">
        <div class="total-row"><span class="t">合計（${cartCount()}点）</span><span class="v tnum">${totalLabel(cartTotal())}</span></div>
        ${amznCount>0?`<button class="btn ghost" id="amznCart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Amazonカートに入れる（${amznCount}品）</button>`:""}
        <button class="btn primary" id="placeOrder">この内容で発注する</button>
        <button class="btn danger sm" id="clearCart">カートを空にする</button>
      </div>`;
    }
    el.innerHTML = `<div class="card-head"><h2>発注カート</h2></div>${body}`;

    $$("#cartCard .stepper").forEach(st=>{
      const id = st.dataset.id;
      st.querySelector('[data-act="inc"]').addEventListener("click", ()=>{ setQty(id, cartQty(id)+1); renderCart(); updateCartBadge(); });
      st.querySelector('[data-act="dec"]').addEventListener("click", ()=>{ setQty(id, cartQty(id)-1); renderCart(); updateCartBadge(); });
    });
    const po = $("#placeOrder");
    if(po) po.addEventListener("click", ()=>{ const msg = finalizeOrder(); pushChat("bot", msg); renderChatMessages(); toast("発注を確定しました"); });
    const cc = $("#clearCart");
    if(cc) cc.addEventListener("click", ()=>{ state.cart[state.currentStore]=[]; save(); renderCart(); updateCartBadge(); toast("カートを空にしました"); });
    const ac = $("#amznCart");
    if(ac) ac.addEventListener("click", ()=>{
      const r = openAmazonCart();
      if(r.ok){
        const skip = r.skipped.length ? `\n（Amazon以外・ASIN未登録の ${r.skipped.length} 品は対象外：${r.skipped.slice(0,5).join("、")}${r.skipped.length>5?" ほか":""}）` : "";
        pushChat("bot", `🛒 Amazonカートに ${r.added} 品目を数量つきで送りました。Amazonのタブで内容を確認し、注文を確定してください。${skip}`);
      }
    });
  }

  /* ----- Master view ----- */
  function renderMaster(){
    const q = masterSearch.trim().toLowerCase();
    const all = scopedProducts();
    const amznReady = all.filter(canAmazonCart).length;
    const list = all.filter(p=> !q || (p.name+p.alias+p.spec+(p.supplier||"")).toLowerCase().includes(q));
    const emptyMsg = all.length===0
      ? `${esc(store().name)}（${esc(store().type)}）の商品はまだ登録されていません。「＋ 商品を登録」から追加してください。`
      : "該当する商品がありません。";
    view.innerHTML = `
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input id="masterSearch" placeholder="商品名・購入先・規格で検索" value="${esc(masterSearch)}" />
        </div>
        <span style="font-size:12.5px;color:var(--muted);font-weight:600"><span class="chip ${store().type==='ホテル'?'hotel':'sauna'}">${esc(store().name)}</span> ${list.length} 件 ・ 🛒数量投入OK ${amznReady}</span>
        <span style="flex:1"></span>
        <select id="copyFrom" class="mini-select" title="他店舗の品目をこの店舗にコピー">
          <option value="">他店舗からコピー…</option>
          ${STORES.filter(s=>s.id!==state.currentStore).map(s=>`<option value="${s.id}">${esc(s.name)}から</option>`).join("")}
        </select>
        <button class="btn ghost" id="copyBtn">コピー</button>
        <button class="btn ghost" id="addProduct">＋ 商品を登録</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>商品</th><th>購入先</th><th>規格・メモ</th><th style="text-align:right">参考単価</th><th>注文</th><th></th>
          </tr></thead>
          <tbody>${
            list.length ? list.map(p=>{
              const oi = orderInfo(p);
              return `
            <tr>
              <td><div class="p-name">${esc(p.name)}</div>${p.alias?`<div class="p-alias">呼び名：${esc(p.alias)}</div>`:""}</td>
              <td><span class="sup ${supplierChipClass(p.supplier)}">${esc(p.supplier||"—")}</span></td>
              <td style="max-width:320px">${esc(p.spec||"—")}</td>
              <td class="num">${priceLabel(p)}</td>
              <td>${oi.url?`<a class="amz" href="${esc(oi.url)}" target="_blank" rel="noopener">${esc(oi.label)} ↗</a>`:`<span style="color:var(--faint);font-size:12px">チャット発注</span>`}${(p.supplier||"Amazon")==="Amazon"?(getAsin(p)?`<div class="cart-ok">🛒 数量投入OK</div>`:`<div class="cart-no">ASIN未登録</div>`):""}</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-edit="${p.id}" aria-label="編集"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                <button class="icon-btn del" data-del="${p.id}" aria-label="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
              </div></td>
            </tr>`;}).join("")
            : `<tr><td colspan="6"><div class="empty">${emptyMsg}</div></td></tr>`
          }</tbody>
        </table>
      </div>`;
    const s = $("#masterSearch");
    s.addEventListener("input", ()=>{ masterSearch = s.value; const pos=s.selectionStart; renderMaster(); const ns=$("#masterSearch"); ns.focus(); ns.setSelectionRange(pos,pos); });
    $("#addProduct").addEventListener("click", ()=>openProductModal());
    $("#copyBtn").addEventListener("click", ()=>{
      const fromId = $("#copyFrom").value;
      if(!fromId){ toast("コピー元の店舗を選んでください"); return; }
      const fromStore = STORES.find(s=>s.id===fromId);
      const exist = new Set(scopedProducts().map(p=>p.name));
      const toCopy = state.products.filter(p=>p.storeId===fromId && !exist.has(p.name));
      if(toCopy.length===0){ toast("コピーできる新しい品目はありません"); return; }
      if(!confirm(`${fromStore.name} の ${toCopy.length} 品目を ${store().name} にコピーします。よろしいですか？`)) return;
      toCopy.forEach(p=>{
        const { id, storeId, ...rest } = p;
        state.products.push({ id: uid(), storeId: state.currentStore, ...rest });
      });
      save(); renderMaster();
      toast(`${toCopy.length} 品目をコピーしました`);
    });
    $$("[data-edit]").forEach(b=> b.addEventListener("click", ()=>openProductModal(b.dataset.edit)));
    $$("[data-del]").forEach(b=> b.addEventListener("click", ()=>{
      const p = product(b.dataset.del);
      if(p && confirm(`「${p.name}」を商品マスタから削除しますか？`)){
        state.products = state.products.filter(x=>x.id!==p.id);
        Object.keys(state.cart).forEach(k=> state.cart[k] = state.cart[k].filter(i=>i.productId!==p.id));
        save(); renderMaster(); updateCartBadge(); toast("削除しました");
      }
    }));
  }

  /* ----- History view ----- */
  function fmtDate(iso){
    const d = new Date(iso);
    const p = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function renderHistory(){
    const h = history();
    if(h.length===0){
      view.innerHTML = `<div class="card"><div class="empty" style="padding:56px 18px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
        <div style="font-size:15px;color:var(--muted);font-weight:700;margin-bottom:4px">${esc(store().name)} の発注履歴はまだありません</div>
        <div>発注チャットで注文を確定すると、ここに記録されます。</div>
      </div></div>`;
      return;
    }
    const totalSum = h.reduce((s,e)=>s+e.total,0);
    const itemSum = h.reduce((s,e)=>s+e.items.reduce((a,i)=>a+i.qty,0),0);
    view.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">発注回数</div><div class="v tnum">${h.length}<small>件</small></div></div>
        <div class="stat"><div class="k">発注点数 合計</div><div class="v tnum">${itemSum}<small>点</small></div></div>
        <div class="stat"><div class="k">金額 合計</div><div class="v tnum">${totalLabel(totalSum)}</div></div>
      </div>
      <div class="toolbar" style="justify-content:flex-end;margin-bottom:14px">
        <button class="btn ghost" id="csvBtn">CSVダウンロード</button>
      </div>
      <div class="section-title">発注履歴（新しい順）</div>
      <div class="hist-list">${
        h.map((e,idx)=>`
        <div class="hist-card">
          <div class="hist-head">
            <span class="no">#${h.length-idx}</span>
            <span class="dt">${fmtDate(e.date)}</span>
            <span class="tot tnum">${totalLabel(e.total)}</span>
          </div>
          <div class="hist-body">${
            e.items.map(i=>`<div class="hist-line"><span>${esc(i.name)} <span style="color:var(--faint);font-size:12px">${esc(i.supplier||i.unit||"")}</span></span><span class="q">× ${i.qty}${i.price>0?" ＝ "+yen(i.price*i.qty):""}</span></div>`).join("")
          }</div>
        </div>`).join("")
      }</div>`;
    $("#csvBtn").addEventListener("click", downloadCSV);
  }

  function downloadCSV(){
    const h = history();
    const rows = [["発注日時","店舗","商品名","購入先","規格・メモ","発注単位","数量","参考単価","小計"]];
    h.forEach(e=>{ e.items.forEach(i=>{
      rows.push([fmtDate(e.date), store().name, i.name, i.supplier||"", i.spec||"", i.unit||"", i.qty, i.price, i.price*i.qty]);
    }); });
    const csv = "﻿" + rows.map(r=> r.map(c=>{
      const v = String(c); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(",")).join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `発注履歴_${store().name}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast("CSVをダウンロードしました");
  }

  /* ----- Stock check (在庫確認ウォークスルー) ----- */
  let stockIndex = 0;
  let stockOrdered = [];   // [{productId, qty}]
  let stockOkCount = 0;
  let stockOrderOpen = false;

  function amazonUrl(p){
    return (p.url && p.url.trim())
      ? p.url.trim()
      : "https://www.amazon.co.jp/s?k=" + encodeURIComponent(p.name);
  }

  function enterStock(){
    stockIndex = 0; stockOrdered = []; stockOkCount = 0; stockOrderOpen = false;
    renderStock();
  }

  function renderStock(){
    const products = scopedProducts();
    if(products.length === 0){
      view.innerHTML = `<div class="stock-wrap"><div class="stock-done">
        <h2>${esc(store().name)} の商品がまだありません</h2>
        <p>${esc(store().type)}用の備品を「商品マスタ」から登録すると、在庫確認ができます。</p>
        <div class="done-actions"><button class="btn primary" id="goMaster">商品マスタへ</button></div>
      </div></div>`;
      $("#goMaster").addEventListener("click", ()=>setView("master"));
      return;
    }
    if(stockIndex >= products.length){ renderStockDone(); return; }

    const p = products[stockIndex];
    const oi = orderInfo(p);
    const total = products.length;
    const pct = Math.round((stockIndex / total) * 100);
    view.innerHTML = `
      <div class="stock-wrap">
        <div class="stock-progress">
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="meta"><span>${esc(store().name)} の在庫確認</span><span style="margin-left:auto"><b>${stockIndex+1}</b> / <b>${total}</b></span></div>
        </div>
        <div class="stock-card">
          <span class="tag">在庫チェック</span>
          <div class="s-name">${esc(p.name)}</div>
          <div style="margin-top:8px"><span class="sup ${supplierChipClass(p.supplier)}">${esc(p.supplier||"—")}</span></div>
          <div class="stock-facts">
            ${p.spec?`<div class="fact" style="max-width:340px"><span class="fk">規格・メモ</span><span class="fv" style="font-weight:600;font-size:12.5px">${esc(p.spec)}</span></div>`:""}
            <div class="fact"><span class="fk">発注単位</span><span class="fv">${esc(p.unit||"—")}</span></div>
            <div class="fact"><span class="fk">参考単価</span><span class="fv">${priceLabel(p)}</span></div>
          </div>
          <div class="s-q">この備品の在庫は足りていますか？</div>
          <div class="s-actions" id="stockActions">
            <button class="big-btn ok" id="btnOk">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              在庫OK
            </button>
            <button class="big-btn order" id="btnOrder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
              発注する
            </button>
          </div>
          <div class="order-panel hide" id="orderPanel">
            <div class="lead">発注する数量を入力してください</div>
            <div class="qty-big">
              <button type="button" id="qDec" aria-label="減らす">−</button>
              <input id="qInput" type="number" min="1" value="1" inputmode="numeric" aria-label="発注数量" />
              <button type="button" id="qInc" aria-label="増やす">＋</button>
            </div>
            <div class="subt">${p.unit?esc(p.unit)+" 単位 ・ ":""}小計 <b id="qSub">${priceLabel(p)}</b></div>
            <div class="buttons">
              ${ oi.url ? `<button class="btn primary" id="btnAmazon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                ${esc(oi.label)}して次へ
              </button>
              <button class="btn ghost" id="btnCartOnly">追加だけして次へ</button>`
              : `<button class="btn primary" id="btnCartOnly">発注リストに追加して次へ</button>` }
            </div>
            <div class="amz-note">${esc(oi.note)}</div>
          </div>
        </div>
        <div class="stock-nav">
          <button class="link-btn" id="btnPrev" ${stockIndex===0?"disabled":""}>← 前へ</button>
          <button class="link-btn" id="btnRestart">最初から</button>
        </div>
      </div>`;

    $("#btnOk").addEventListener("click", ()=>{ stockOkCount++; nextStock(); });
    $("#btnOrder").addEventListener("click", ()=>{
      stockOrderOpen = true;
      $("#orderPanel").classList.remove("hide");
      $("#stockActions").classList.add("hide");
      const qi = $("#qInput"); qi.focus(); qi.select();
    });
    $("#btnPrev").addEventListener("click", ()=>{ if(stockIndex>0){ stockIndex--; renderStock(); } });
    $("#btnRestart").addEventListener("click", enterStock);

    // quantity panel
    const qInput = $("#qInput");
    const clampQty = ()=>{ let v = parseInt(qInput.value,10); if(isNaN(v)||v<1) v=1; qInput.value=v; return v; };
    const refreshSub = ()=>{ const q=clampQty(); $("#qSub").textContent = p.price>0 ? yen(p.price*q) : "—"; };
    $("#qDec").addEventListener("click", ()=>{ qInput.value = Math.max(1, clampQty()-1); refreshSub(); });
    $("#qInc").addEventListener("click", ()=>{ qInput.value = clampQty()+1; refreshSub(); });
    qInput.addEventListener("input", refreshSub);

    const commitOrder = (openExternal)=>{
      const qty = clampQty();
      addToCart(p.id, qty);
      stockOrdered.push({ productId:p.id, qty });
      updateCartBadge();
      if(openExternal && oi.url) window.open(oi.url, "_blank", "noopener");
      toast(`「${p.name}」を ${qty} 発注リストに追加`);
      nextStock();
    };
    const btnA = $("#btnAmazon");
    if(btnA) btnA.addEventListener("click", ()=>commitOrder(true));
    $("#btnCartOnly").addEventListener("click", ()=>commitOrder(false));
  }

  function nextStock(){ stockIndex++; stockOrderOpen=false; renderStock(); }

  function renderStockDone(){
    const ordered = stockOrdered.map(o=>({ p:product(o.productId), qty:o.qty })).filter(x=>x.p);
    const orderTotal = ordered.reduce((s,x)=>s + x.p.price*x.qty, 0);
    const amznReady = ordered.filter(x=>canAmazonCart(x.p)).length;
    view.innerHTML = `
      <div class="stock-wrap">
        <div class="stock-progress"><div class="bar"><span style="width:100%"></span></div>
          <div class="meta"><span>${esc(store().name)} の在庫確認</span><span style="margin-left:auto"><b>完了</b></span></div>
        </div>
        <div class="stock-done">
          <div class="big-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <h2>在庫確認が完了しました</h2>
          <p>在庫OK ${stockOkCount} 件 ／ 発注 ${ordered.length} 件</p>
          ${ ordered.length ? `
            <div class="done-list">${
              ordered.map(x=>`<div class="dl-row">
                <span><b>${esc(x.p.name)}</b> <span class="sup ${supplierChipClass(x.p.supplier)}" style="margin-left:4px">${esc(x.p.supplier||"—")}</span></span>
                <span class="q">× ${x.qty}${x.p.price>0?" ＝ "+yen(x.p.price*x.qty):""}</span>
              </div>`).join("")
            }<div class="dl-row" style="background:var(--surface-2)"><span style="font-weight:800">発注カート 合計</span><span class="q" style="font-size:15px">${totalLabel(orderTotal)}</span></div></div>
            <div class="done-actions">
              ${amznReady>0?`<button class="btn ghost" id="doneAmazon">🛒 Amazonカートに入れる（${amznReady}品）</button>`:""}
              <button class="btn primary" id="doneFinalize">この内容で発注を確定</button>
              <button class="btn ghost" id="doneCart">発注カートを見る</button>
              <button class="btn ghost" id="doneRestart">もう一度確認</button>
            </div>`
          : `<p style="color:var(--faint)">発注が必要な備品はありませんでした。</p>
            <div class="done-actions"><button class="btn primary" id="doneRestart">もう一度確認</button></div>`
          }
        </div>
      </div>`;
    const amz = $("#doneAmazon");
    if(amz) amz.addEventListener("click", ()=>openAmazonCart());
    const fin = $("#doneFinalize");
    if(fin) fin.addEventListener("click", ()=>{ const msg = finalizeOrder(); toast("発注を確定しました"); pushChat("bot", msg); setView("history"); });
    const dc = $("#doneCart");
    if(dc) dc.addEventListener("click", ()=>setView("chat"));
    $("#doneRestart").addEventListener("click", enterStock);
  }

  /* ----- Product modal ----- */
  function openProductModal(id){
    const p = id ? product(id) : null;
    $("#modalTitle").textContent = p ? "商品を編集" : "商品を登録";
    $("#f-id").value = p ? p.id : "";
    $("#f-url").value = p ? (p.url||"") : "";
    $("#f-asin").value = p ? (p.asin||"") : "";
    $("#f-name").value = p ? p.name : "";
    $("#f-supplier").value = p ? (p.supplier||"Amazon") : "Amazon";
    $("#f-alias").value = p ? (p.alias||"") : "";
    $("#f-spec").value = p ? (p.spec||"") : "";
    $("#f-unit").value = p ? (p.unit||"") : "";
    $("#f-price").value = (p && p.price>0) ? p.price : "";
    $("#overlay").classList.add("open");
    setTimeout(()=>$("#f-name").focus(), 50);
  }
  function closeModal(){ $("#overlay").classList.remove("open"); }
  function saveProduct(){
    const name = $("#f-name").value.trim();
    let price = parseInt($("#f-price").value, 10);
    if(isNaN(price) || price<0) price = 0;
    if(!name){ $("#f-name").focus(); toast("商品名を入力してください"); return; }
    const data = {
      url: $("#f-url").value.trim(),
      asin: $("#f-asin").value.trim().toUpperCase(),
      name,
      supplier: $("#f-supplier").value,
      alias: $("#f-alias").value.trim(),
      spec: $("#f-spec").value.trim(),
      unit: $("#f-unit").value.trim(),
      price,
    };
    const id = $("#f-id").value;
    if(id){ const p = product(id); if(p) Object.assign(p, data); toast("更新しました"); }
    else { state.products.unshift({ id: uid(), storeId: state.currentStore, ...data }); toast(`${store().name} に商品を登録しました`); }
    save(); closeModal(); renderMaster();
  }

  /* ========= Theme ========= */
  function applyTheme(){
    if(state.theme) document.documentElement.setAttribute("data-theme", state.theme);
    else document.documentElement.removeAttribute("data-theme");
    const isDark = state.theme ? state.theme==="dark"
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    $("#themeLabel").textContent = isDark ? "ライトにする" : "ダークにする";
  }
  $("#themeToggle").addEventListener("click", ()=>{
    const isDark = state.theme ? state.theme==="dark"
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    state.theme = isDark ? "light" : "dark"; save(); applyTheme();
  });

  /* ========= Sidebar (mobile) ========= */
  function openSidebar(){ $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); }
  function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); }
  $("#menuBtn").addEventListener("click", openSidebar);
  $("#scrim").addEventListener("click", closeSidebar);

  /* ========= Wire up ========= */
  $("#storeSelect").addEventListener("change", e=>{
    state.currentStore = e.target.value; save();
    renderStoreSelect(); updateCartBadge(); setView(activeView);
  });
  $("#nav").addEventListener("click", e=>{
    const b = e.target.closest("button[data-view]"); if(b) setView(b.dataset.view);
  });
  $("#addProductTop").addEventListener("click", ()=>openProductModal());
  $("#modalClose").addEventListener("click", closeModal);
  $("#modalCancel").addEventListener("click", closeModal);
  $("#modalSave").addEventListener("click", saveProduct);
  $("#productForm").addEventListener("submit", e=>{ e.preventDefault(); saveProduct(); });
  $("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

  /* ========= Init ========= */
  applyTheme();
  renderStoreSelect();
  updateCartBadge();
  setView("chat");
})();
</script>

</body>
</html>
